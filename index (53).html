<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIU · Stock Road No.1 — Grade-wise Live</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f3f5f9; --card:#fff; --ink:#14213d; --muted:#6b7686; --line:#e3e8f0;
  --brand:#14325c; --brand2:#1f4e8c; --accent:#e08a00; --ok:#12805c; --bad:#c0392b; --warn:#b7791f;
  --grp:#eaf0f8; --sub:#f6f8fc;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;padding:14px 22px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand h1{margin:0;font-size:19px;letter-spacing:.2px}
.brand small{opacity:.8;font-size:12px}
.hright{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);padding:5px 10px;border-radius:99px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#9aa7b8}
.dot.live{background:#3ddc97;box-shadow:0 0 0 3px rgba(61,220,151,.25)}
.dot.off{background:#ff8a7a}
button,.btn{font:inherit;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn-light{background:#fff;color:var(--brand)}
.btn-ghost{background:rgba(255,255,255,.14);color:#fff}
.btn-light:hover{background:#eef3fb}.btn-ghost:hover{background:rgba(255,255,255,.24)}
main{max-width:1280px;margin:0 auto;padding:18px 16px 40px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand2)}
.kpi.a:before{background:var(--accent)} .kpi.g:before{background:var(--ok)} .kpi.r:before{background:var(--bad)}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.banner{border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;border:1px solid}
.banner.ok{background:#e9f7f1;border-color:#bfe6d6;color:#0c5c42}
.banner.bad{background:#fdecea;border-color:#f5c2bc;color:#8e281d}
.banner.warn{background:#fff6e0;border-color:#f1d9a0;color:#7a5410}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);background:#fafbfd;padding:0 8px}
.tab{padding:11px 16px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;background:none;border-radius:0}
.tab.on{color:var(--brand2);border-color:var(--brand2)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.bar input[type=search],.bar select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;background:#fff;min-width:140px}
.bar input[type=search]{min-width:220px}
.bar label{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;cursor:pointer}
.sp{flex:1}
.count{color:var(--muted);font-size:12px}
.wrap{overflow:auto;max-height:68vh}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:900px}
th{position:sticky;top:0;background:var(--brand);color:#fff;text-align:left;padding:10px 12px;font-size:12px;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap;cursor:pointer;z-index:2}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:hover td{background:#f4f8ff}
tr.grp td{background:var(--grp);font-weight:800;color:var(--brand);border-top:2px solid #cfdcee;cursor:pointer}
tr.sub td{background:var(--sub);font-weight:700;border-bottom:2px solid #cfdcee}
tr.tot td{background:#102a4c;color:#fff;font-weight:800;position:sticky;bottom:0}
.neg{color:var(--bad);font-weight:700}.pos{color:var(--ok)}.zero{color:#9aa7b8}
.tag{display:inline-block;background:#eef2f8;border-radius:6px;padding:1px 7px;font-size:12px;color:#33445f}
.mt{background:#fff1d6;color:#8a5a00}
.empty{padding:50px;text-align:center;color:var(--muted)}
#toast{position:fixed;right:18px;bottom:18px;background:#14213d;color:#fff;padding:11px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;max-width:420px;z-index:9}
.drop{border:2px dashed #b9c6da;border-radius:14px;padding:46px 20px;text-align:center;color:var(--muted);margin:18px;background:#fbfcfe}
.drop b{color:var(--brand2)}
@media print{header .hright,.bar,.tabs,#toast{display:none}.wrap{max-height:none}body{background:#fff}}
@media(max-width:640px){.kpi .v{font-size:21px}header{padding:12px}}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Rajasthan Ispat Udyog · Stock Road No.1</h1><small>Grade-wise stock — live view</small></div>
  <div class="hright">
    <span class="chip"><span class="dot" id="dot"></span><span id="status">Connecting…</span></span>
    <span class="chip" id="stamp">No data yet</span>
    <button class="btn-ghost" id="btnExport">Export Excel</button>
    <button class="btn-ghost" onclick="window.print()">Print</button>
    <button class="btn-light" id="btnUpload">⬆ Upload Excel</button>
    <input type="file" id="file" accept=".xlsx,.xlsm,.xls" hidden>
  </div>
</header>

<main>
  <div id="banner"></div>
  <section class="kpis" id="kpis"></section>

  <div class="panel">
    <div class="tabs">
      <button class="tab on" data-t="gw">Grade-wise</button>
      <button class="tab" data-t="sm">Item summary</button>
    </div>
    <div class="bar" id="bar">
      <input type="search" id="q" placeholder="Search grade, item, size…">
      <select id="fMake"></select><select id="fGrade"></select><select id="fItem"></select>
      <label><input type="checkbox" id="hideNil" checked> Hide NIL</label>
      <label id="lblGroup"><input type="checkbox" id="grouped" checked> Group by grade</label>
      <span class="sp"></span><span class="count" id="count"></span>
    </div>
    <div class="wrap" id="view"></div>
  </div>
</main>
<div id="toast"></div>

<script>
/* ======== CONFIG ======== */
const DB  = "https://cutter--2026-default-rtdb.asia-southeast1.firebasedatabase.app";
const PATH = "roadStock1/latest";          // Firebase path used by this page
const UPLOAD_PIN = "";                      // optional: set a PIN to protect uploads, e.g. "1234"

/* ======== STATE ======== */
let DATA = null, tab = 'gw', sortKey = null, sortDir = 1, collapsed = {};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (n, d=3) => (typeof n === 'number' && isFinite(n)) ? n.toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d}) : '';
const fmtI = n => (typeof n === 'number' && isFinite(n)) ? n.toLocaleString('en-IN',{maximumFractionDigits:0}) : (n ?? '');
const num = x => (typeof x === 'number' && isFinite(x)) ? x : 0;
const isNum = x => typeof x === 'number' && isFinite(x);

function toast(msg, ms=4500){ const t=$('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none',ms); }
function setStatus(kind, text){ $('dot').className='dot '+kind; $('status').textContent=text; }

/* ======== EXCEL PARSING (Structure sheet se grade-wise + item-wise khud banta hai) ======== */
function parseWorkbook(wb, fileName){
  const ws = wb.Sheets['Structure'];
  if(!ws) throw new Error('Excel mein "Structure" sheet nahi mili');
  const range = XLSX.utils.decode_range(ws['!ref']);
  const last = range.e.r + 1;
  const C = (col,r) => ws[col+r];
  const raw = (col,r) => { const c = C(col,r); return (c && c.v !== undefined && c.v !== null) ? c.v : ''; };
  const isBlank = (col,r) => { const c = C(col,r); return !c || c.v === undefined || c.v === null || c.v === ''; };
  const n = (col,r) => { const c = C(col,r); return (c && typeof c.v === 'number') ? c.v : 0; };
  const norm = s => String(s).toUpperCase().replace(/[\s-]/g,'');
  const sizeNorm = g => g==='' ? '' : String(g).toUpperCase().replace(/MM/g,'').trim().replace(/\s+/g,' ').replace(/ /g,'X');
  const lenStr = v => String(v).toUpperCase().replace(/\s/g,'');

  // row info
  const R = {};
  for(let r=3; r<=last; r++){
    const item = String(raw('E',r)).trim();
    const hasBal = !isBlank('T',r) || !isBlank('U',r) || !isBlank('V',r);
    if(!hasBal && item==='') continue;
    const size = sizeNorm(raw('G',r));
    R[r] = { r, make:String(raw('C',r)).trim(), grade:String(raw('D',r)).trim(), item, size, len: raw('I',r),
             y: [norm(raw('C',r)),norm(raw('D',r)),String(raw('E',r)).toUpperCase().replace(/\s/g,''),size,lenStr(raw('I',r))].join('|'),
             y2: [String(raw('E',r)).toUpperCase().replace(/\s/g,''),size,lenStr(raw('I',r))].join('|'),
             hasT: !isBlank('T',r) };
  }
  // effect of each row = how much this row changed the balance (works even if rows are inserted/deleted)
  const spec = {T:['N','S'], U:['K','R'], V:['L','R']};
  let errCells = 0; const mislink = [], noFormula = [];
  const effect = (col,r) => {
    const c = C(col,r), fb = n(spec[col][0],r) - n(spec[col][1],r);
    if(!c || c.v===undefined || c.v==='') return 0;
    if(c.t==='e'){ return fb; }
    if(typeof c.v !== 'number') return 0;
    if(c.f){
      const m = String(c.f).match(new RegExp('^'+col+'(\\d+)(?=[+\\-]|$)'));
      if(m){
        const p = +m[1], pc = C(col,p);
        if(R[p] && R[p].y === R[r].y && pc && typeof pc.v==='number') return c.v - pc.v;
        if(R[p] && R[p].y !== R[r].y && col==='T') mislink.push(r);
        return c.v;
      }
    }
    return c.v;
  };
  for(const r in R){
    ['T','U','V'].forEach(col=>{ const c=C(col,r); if(c && c.t==='e') errCells++; });
    R[r].eT = effect('T',+r); R[r].eU = effect('U',+r); R[r].eV = effect('V',+r);
    if(!R[r].hasT && isBlank('U',+r) && isBlank('V',+r)) noFormula.push(+r);
  }
  // group by key (order of first appearance)
  const gwMap = new Map(), smMap = new Map();
  Object.values(R).forEach(x => {
    let g = gwMap.get(x.y);
    if(!g){ g = {make:x.make,grade:x.grade,item:x.item,size:x.size,secWt:'',len:x.len,hasT:false,pcs:0,inv:0,kanta:0}; gwMap.set(x.y,g); }
    if(!isBlank('H',x.r)) g.secWt = raw('H',x.r);
    g.hasT = g.hasT || x.hasT; g.pcs += x.eT; g.inv += x.eU; g.kanta += x.eV;
    let s = smMap.get(x.y2);
    if(!s){ s = {item:x.item,size:x.size,len:x.len,hasT:false,pcs:0,inv:0,kanta:0}; smMap.set(x.y2,s); }
    s.hasT = s.hasT || x.hasT; s.pcs += x.eT; s.inv += x.eU; s.kanta += x.eV;
  });
  const fin = g => ({make:g.make,grade:g.grade,item:g.item,size:g.size,secWt:g.secWt,len:g.len,
    pcs: g.hasT ? Math.round(g.pcs*1000)/1000 : 'MT ONLY', inv: Math.round(g.inv*1e6)/1e6, kanta: Math.round(g.kanta*1e6)/1e6, diff: Math.round((g.kanta-g.inv)*1e6)/1e6});
  const gw = [...gwMap.values()].map(fin);
  const sm = [...smMap.values()].map(g => { const o = fin(g); delete o.make; delete o.grade; delete o.secWt; return o; });
  const warn = [];
  if(mislink.length) warn.push(mislink.length+' row ki chain dusre model se judi hai (Structure row: '+mislink.slice(0,12).join(', ')+(mislink.length>12?' …':'')+') — in rows ki balance formula theek karo.');
  if(noFormula.length) warn.push(noFormula.length+' row mein balance (T/U/V) nahi hai (row: '+noFormula.slice(0,12).join(', ')+(noFormula.length>12?' …':'')+').');
  return { fileName, updatedAt: Date.now(), gw, sm, errCells, check: (errCells||mislink.length||noFormula.length) ? 'CHECK' : 'OK', msg: warn.join(' ') };
}

/* ======== FIREBASE (REST) ======== */
async function pushToFirebase(d){
  const r = await fetch(`${DB}/${PATH}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
  if(!r.ok) throw new Error('Firebase '+r.status+' '+(await r.text()).slice(0,120));
}
async function pullFromFirebase(){
  const r = await fetch(`${DB}/${PATH}.json?ts=${Date.now()}`,{cache:'no-store'});
  if(!r.ok) throw new Error('Firebase '+r.status);
  return await r.json();
}
async function load(){
  try{
    const d = await pullFromFirebase();
    setStatus('live','Live');
    if(d && d.gw && (!DATA || d.updatedAt !== DATA.updatedAt)){ DATA = normalize(d); render(); }
    else if(!d && !DATA){ render(); }
  }catch(e){ setStatus('off','Offline'); if(!DATA) render(); }
}
function normalize(d){ d.gw = d.gw || []; d.sm = d.sm || []; return d; }
function listen(){
  try{
    const es = new EventSource(`${DB}/${PATH}.json`);
    es.addEventListener('put', load); es.addEventListener('patch', load);
    es.onerror = () => { setStatus('off','Reconnecting…'); };
    es.onopen = () => setStatus('live','Live');
  }catch(e){}
  setInterval(load, 60000);
}

/* ======== UPLOAD ======== */
$('btnUpload').onclick = () => {
  if(UPLOAD_PIN){ const p = prompt('Upload PIN daalo'); if(p !== UPLOAD_PIN){ toast('Galat PIN'); return; } }
  $('file').click();
};
$('file').onchange = e => { const f = e.target.files[0]; if(f) handleFile(f); e.target.value=''; };
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); const f=e.dataTransfer.files[0]; if(f) $('btnUpload').onclick.call ? handleDrop(f) : 0; });
function handleDrop(f){ if(UPLOAD_PIN){ const p=prompt('Upload PIN daalo'); if(p!==UPLOAD_PIN){toast('Galat PIN');return;} } handleFile(f); }
function handleFile(f){
  const rd = new FileReader();
  rd.onload = async ev => {
    try{
      const wb = XLSX.read(new Uint8Array(ev.target.result),{type:'array',sheets:'Structure'});
      const d = parseWorkbook(wb, f.name);
      DATA = d; render();
      try{ await pushToFirebase(d); setStatus('live','Live'); toast('✔ Upload ho gaya — sabko live dikh raha hai'); }
      catch(err){ setStatus('off','Local only'); toast('Data dikh raha hai, par live save nahi hua: '+err.message, 9000); }
    }catch(err){ toast('Excel read nahi hua: '+err.message, 8000); }
  };
  rd.readAsArrayBuffer(f);
}

/* ======== FILTERS / DATA VIEW ======== */
const isNil = r => num(r.pcs)===0 && Math.abs(num(r.inv))<0.0005 && Math.abs(num(r.kanta))<0.0005;
function opts(sel, label, vals){
  const cur = sel.value; sel.innerHTML = `<option value="">${label}</option>` + vals.map(v=>`<option>${esc(v)}</option>`).join(''); sel.value = vals.includes(cur)?cur:'';
}
function uniq(a){ return [...new Set(a.filter(x=>x!==''))].sort((x,y)=>String(x).localeCompare(String(y),undefined,{numeric:true})); }
function filtered(){
  const base = tab==='gw' ? DATA.gw : DATA.sm;
  const q = $('q').value.trim().toLowerCase(), mk=$('fMake').value, gr=$('fGrade').value, it=$('fItem').value, hide=$('hideNil').checked;
  return base.filter(r => {
    if(hide && isNil(r)) return false;
    if(tab==='gw' && mk && r.make!==mk) return false;
    if(tab==='gw' && gr && r.grade!==gr) return false;
    if(it && r.item!==it) return false;
    if(q){ const s = Object.values(r).join(' ').toLowerCase(); if(!q.split(/\s+/).every(w=>s.includes(w))) return false; }
    return true;
  });
}
function sums(rows){ return {pcs:rows.reduce((a,r)=>a+num(r.pcs),0), inv:rows.reduce((a,r)=>a+num(r.inv),0), kanta:rows.reduce((a,r)=>a+num(r.kanta),0), diff:rows.reduce((a,r)=>a+num(r.diff),0)}; }
const cls = v => v<-0.0005?'neg':(v>0.0005?'':'zero');
const diffCell = v => `<td class="n ${Math.abs(num(v))<0.0005?'zero':(num(v)<0?'neg':'pos')}">${isNum(v)?fmt(v):''}</td>`;
const pcsCell = v => v==='MT ONLY' ? `<td class="n"><span class="tag mt">MT ONLY</span></td>` : `<td class="n ${cls(num(v))}">${fmtI(v)}</td>`;
const mtCell = v => `<td class="n ${cls(num(v))}">${isNum(v)?fmt(v):''}</td>`;

/* ======== RENDER ======== */
function render(){
  if(!DATA){
    $('view').innerHTML = `<div class="drop"><b>Abhi koi data nahi hai.</b><br>Upar <b>Upload Excel</b> dabao ya Excel file yahan drop karo.<br>Apni stock Excel (jisme "Structure" sheet ho) save karke upload karo — grade-wise aur item-wise apne aap ban jayega.</div>`;
    $('kpis').innerHTML=''; $('banner').innerHTML=''; $('count').textContent=''; return;
  }
  // filters
  opts($('fMake'),'All make',uniq(DATA.gw.map(r=>r.make))); opts($('fGrade'),'All grades',uniq(DATA.gw.map(r=>r.grade)));
  opts($('fItem'),'All items',uniq((tab==='gw'?DATA.gw:DATA.sm).map(r=>r.item)));
  $('fMake').style.display=$('fGrade').style.display=$('lblGroup').style.display = tab==='gw'?'':'none';
  $('stamp').textContent = 'Updated: ' + new Date(DATA.updatedAt).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) + ' · ' + DATA.fileName;
  renderKpis(); renderBanner(); renderTable();
}
function renderKpis(){
  const all = DATA.gw.filter(r=>!isNil(r)), s = sums(DATA.gw);
  const items = new Set(all.map(r=>r.item)).size;
  const k = [
    ['','Active models',fmtI(all.length),`${items} item types`],
    ['a','Remain pcs',fmtI(s.pcs),'excl. MT-only rows'],
    ['g','Balance (Invoice)',fmt(s.inv)+' MT',''],
    ['','Balance (Kanta)',fmt(s.kanta)+' MT',''],
    [Math.abs(s.kanta-s.inv)>0.5?'r':'g','Difference (Kanta − Invoice)',fmt(s.kanta-s.inv)+' MT','']
  ];
  $('kpis').innerHTML = k.map(([c,l,v,s2])=>`<div class="kpi ${c}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s2||'&nbsp;'}</div></div>`).join('');
}
function renderBanner(){
  let h='';
  const bad = DATA.errCells>0 || (DATA.check && DATA.check!=='OK');
  if(DATA.errCells>0) h+=`<div class="banner bad">⚠ Excel mein ${DATA.errCells} cell error (#REF!/#NAME?) hain — Structure sheet mein error wali row theek karke dobara upload karo.</div>`;
  else if(DATA.check==='CHECK' && !DATA.msg) h+=`<div class="banner warn">⚠ Data mein kuch rows check karne layak hain (neeche likha hai).</div>`;
  else if(DATA.check==='OK') h+=`<div class="banner ok">✔ Data check OK — koi error ya galat chain nahi mili.</div>`;
  if(DATA.msg) h+=`<div class="banner warn">⚠ Check karo: ${esc(DATA.msg)}</div>`;
  $('banner').innerHTML=h;
}
function th(label,key,n){ return `<th class="${n?'n':''}" data-k="${key}">${label}${sortKey===key?(sortDir>0?' ▲':' ▼'):''}</th>`; }
function renderTable(){
  const rows = filtered();
  $('count').textContent = rows.length + ' rows';
  if(!rows.length){ $('view').innerHTML='<div class="empty">Koi row nahi mili — filter badal ke dekho.</div>'; return; }
  const cmp = (a,b)=>{ const x=a[sortKey], y=b[sortKey]; return (isNum(x)&&isNum(y)? x-y : String(x).localeCompare(String(y),undefined,{numeric:true}))*sortDir; };
  if(sortKey) rows.sort(cmp);
  let h = '<table><thead><tr>';
  if(tab==='gw') h += th('Make','make')+th('Grade','grade')+th('Item','item')+th('Size','size')+th('Sec wt/mtr','secWt',1)+th('Length','len',1)+th('Remain pcs','pcs',1)+th('Invoice MT','inv',1)+th('Kanta MT','kanta',1)+th('Diff MT','diff',1);
  else h += th('Item','item')+th('Size','size')+th('Length','len',1)+th('Remain pcs','pcs',1)+th('Invoice MT','inv',1)+th('Kanta MT','kanta',1)+th('Diff MT','diff',1);
  h += '</tr></thead><tbody>';
  const colspan = tab==='gw'?10:7;
  const rowHtml = r => tab==='gw'
    ? `<tr><td>${esc(r.make)}</td><td>${esc(r.grade)}</td><td>${esc(r.item)}</td><td>${esc(r.size)}</td><td class="n">${isNum(r.secWt)?fmt(r.secWt,2):''}</td><td class="n">${esc(r.len)}</td>${pcsCell(r.pcs)}${mtCell(r.inv)}${mtCell(r.kanta)}${diffCell(r.diff)}</tr>`
    : `<tr><td>${esc(r.item)}</td><td>${esc(r.size)}</td><td class="n">${esc(r.len)}</td>${pcsCell(r.pcs)}${mtCell(r.inv)}${mtCell(r.kanta)}${diffCell(r.diff)}</tr>`;
  const sumRow = (label,s,c) => `<tr class="${c}"><td colspan="${tab==='gw'?6:3}">${label}</td><td class="n">${fmtI(s.pcs)}</td><td class="n">${fmt(s.inv)}</td><td class="n">${fmt(s.kanta)}</td><td class="n">${fmt(s.kanta-s.inv)}</td></tr>`;
  if(tab==='gw' && $('grouped').checked && !sortKey){
    const groups = {}; rows.forEach(r=>{ const k=r.make+' · '+r.grade; (groups[k]=groups[k]||[]).push(r); });
    Object.keys(groups).sort().forEach(g=>{
      const s = sums(groups[g]), open = !collapsed[g];
      h += `<tr class="grp" data-g="${esc(g)}"><td colspan="6">${open?'▾':'▸'} ${esc(g)} <span class="tag">${groups[g].length} models</span></td><td class="n">${fmtI(s.pcs)}</td><td class="n">${fmt(s.inv)}</td><td class="n">${fmt(s.kanta)}</td><td class="n">${fmt(s.kanta-s.inv)}</td></tr>`;
      if(open) h += groups[g].map(rowHtml).join('');
    });
  } else h += rows.map(rowHtml).join('');
  h += sumRow('TOTAL (filtered)', sums(rows), 'tot') + '</tbody></table>';
  $('view').innerHTML = h;
  $('view').querySelectorAll('th').forEach(t=>t.onclick=()=>{ const k=t.dataset.k; if(sortKey===k) sortDir*=-1; else {sortKey=k;sortDir=1;} renderTable(); });
  $('view').querySelectorAll('tr.grp').forEach(t=>t.onclick=()=>{ const g=t.dataset.g; collapsed[g]=!collapsed[g]; renderTable(); });
}

/* ======== EXPORT ======== */
$('btnExport').onclick = () => {
  if(!DATA){ toast('Pehle data upload karo'); return; }
  const rows = filtered();
  const head = tab==='gw' ? ['Make','Grade','Item','Size','Section wt/mtr','Length','Remain pcs','Invoice MT','Kanta MT','Diff MT'] : ['Item','Size','Length','Remain pcs','Invoice MT','Kanta MT','Diff MT'];
  const body = rows.map(r => tab==='gw' ? [r.make,r.grade,r.item,r.size,r.secWt,r.len,r.pcs,r.inv,r.kanta,r.diff] : [r.item,r.size,r.len,r.pcs,r.inv,r.kanta,r.diff]);
  const ws = XLSX.utils.aoa_to_sheet([head,...body]); const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, tab==='gw'?'Grade-wise':'Summary');
  XLSX.writeFile(wb, 'RIU_Road1_'+(tab==='gw'?'Gradewise':'Summary')+'_'+new Date().toISOString().slice(0,10)+'.xlsx');
};

/* ======== WIRING ======== */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on')); t.classList.add('on'); tab=t.dataset.t; sortKey=null; $('fItem').value=''; if(DATA) render(); });
['q','fMake','fGrade','fItem','hideNil','grouped'].forEach(id=>$(id).addEventListener('input',()=>DATA&&renderTable()));
render(); load(); listen();
</script>
</body>
</html>
